name: Build FamilyRemote APKs

on:
  push:
    branches:
      - chatgpt-familyremote-build
    paths:
      - '.github/workflows/build-familyremote.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat chatgpt-build/source.b64.* > /tmp/familyremote.b64
          base64 --decode /tmp/familyremote.b64 > /tmp/FamilyRemote_Source.zip
          unzip -q /tmp/FamilyRemote_Source.zip -d "$GITHUB_WORKSPACE/buildsrc"
          test -f "$GITHUB_WORKSPACE/buildsrc/FamilyRemote/settings.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build both APKs
        working-directory: buildsrc/FamilyRemote
        run: gradle :cameraapp:assembleDebug :viewerapp:assembleDebug --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          cp buildsrc/FamilyRemote/cameraapp/build/outputs/apk/debug/cameraapp-debug.apk dist/FamilyCamera.apk
          cp buildsrc/FamilyRemote/viewerapp/build/outputs/apk/debug/viewerapp-debug.apk dist/FamilyViewer.apk
          sha256sum dist/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FamilyRemote-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1
