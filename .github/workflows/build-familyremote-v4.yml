name: Build FamilyRemote APKs v4

on:
  push:
    branches:
      - chatgpt-familyremote-build
    paths:
      - '.github/workflows/build-familyremote-v4.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          cat \
            chatgpt-build/source.b64.00 \
            chatgpt-build/source.b64.01 \
            chatgpt-build/source.b64.02 \
            chatgpt-build/source.b64.03.correct \
            chatgpt-build/source.b64.04.exact \
            chatgpt-build/source.b64.05 > /tmp/familyremote.b64
          base64 --decode /tmp/familyremote.b64 > /tmp/FamilyRemote_Source.zip
          echo "3f4712e13573fc2d22ee137db0b010d02cd6c4b892f85121ff9e802067d22e78  /tmp/FamilyRemote_Source.zip" | sha256sum -c -
          unzip -q /tmp/FamilyRemote_Source.zip -d "$GITHUB_WORKSPACE/buildsrc"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build both APKs
        working-directory: buildsrc/FamilyRemote
        run: gradle :cameraapp:assembleDebug :viewerapp:assembleDebug --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          cp buildsrc/FamilyRemote/cameraapp/build/outputs/apk/debug/cameraapp-debug.apk dist/FamilyCamera.apk
          cp buildsrc/FamilyRemote/viewerapp/build/outputs/apk/debug/viewerapp-debug.apk dist/FamilyViewer.apk
          sha256sum dist/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FamilyRemote-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1
